[package]
name = "sproink"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "In-memory spreading activation engine with CSR graph"
license = "Apache-2.0"
repository = "https://github.com/nvandessel/sproink"
keywords = ["spreading-activation", "graph", "csr", "memory", "ffi"]
categories = ["algorithms", "data-structures", "science"]

[lib]
crate-type = ["lib"]

[features]
serde = ["dep:serde"]
ffi = []

[dependencies]
rayon = "1.12"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
typed-builder = "0.23"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
proptest = "1.9"
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"

[[bench]]
name = "propagation"
harness = false
